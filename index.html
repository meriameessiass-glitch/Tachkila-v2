<!DOCTYPE html>
<html>
    <head>
         <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tachkila</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="joueurs.js" type="module" defer></script>
        <script src="donnees-initiales.js" type="module" defer></script>

    </head>
    <body class="">
        <header class="bg-black flex   justify-between flex-wrap items-center  px-8 h-auto py-2 gap-4 sm:px-8 shadow-md sticky top-0 z-50">
            <div class="shrink-0 h-auto object-contain">
                <img class="w-24 sm:w-32 flex-shrink-0" src="img/1793200483999509905_173976643_0.png" alt="logo">
            </div>
            <nav>
                <ul class="flex text-green-100 gap-4">
                    <li class="bg-green-800 border-none rounded-[4px] fles font-medium  items-center justify-center  p-2 lien-actif"><a href="index.html" class="lien-actif">Effectif</a></li>
                    <li><a href="composition.html" >Composition</a></li>
                    <li><a href="matchs.html" >Matchs</a></li>
                </ul>
            </nav>
            <div class="flex display:flex gap-2 place-items-center">
                <div class="text-yellow-500 font-bold text-[12px]">GD</div>
                <div class="border border-indigo-600 rounded-[10vw] w-2 h-2 bg-yellow-500"></div>
                <div class="text-blue-600 font-bold text-[12px]">DEF</div>
                <div class="border border-indigo-500 rounded-[10vw] w-2 h-2 bg-blue-600"></div>
                <div class="text-green-500 font-bold text-[12px]">MIL</div>
                <div class="border border-indigo-600 rounded-[10vw] w-2 h-2 bg-green-500"></div>
                <div class="text-red-500 text-100px font-bold text-[12px]">ATT</div>
                <div class="border border-indigo-600 rounded-[10vw] w-2 h-2 bg-red-500"></div>
            </div>

        </header>
        <main class="mx-auto max-w-[1280px] px-4 pb-12 pt-6 sm:px-16 sm:pt-10 bg-mist-100">
            <h1 class="font-display text-[40px] font-bold uppercase leading-none tracking-wide">Effectif</h1>
            <p class="mb-5 mt-1 text-sm text-muted">Atlas FC · 4 joueurs affichés sur 22</p>
            <div class="mb-6 flex flex-wrap gap-3">
                <input type="search" placeholder="Rechercher un joueur" class="h-11 min-w-full flex-1 rounded-lg border  bg-white px-3 text-[15px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand sm:min-w-0" id="Rechercher" value="">
                <select aria-label="filtrer par poste" class="h-11 flex-1 rounded-lg border border-line bg-white px-3 text-[15px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand sm:min-w-0 " id="filtrer">
                    <option value="">Toute les postes</option>
                    <option value="GB">Gardien</option>
                    <option value="DF">Défenseur</option>
                    <option value="AT">Ataquant</option>
                    <option value="MIL">Milieu</option>
                </select>
                <button type="button" class="h-11 rounded-lg bg-yellow-700 px-[18px] text-[15px] font-bold text-white hover:bg-[#186540]" id="ajouter">Ajouter un joueur</button>
            </div>
            <section id="section" class="section1 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></section>
            <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                
               <form id="form" hidden
                          class="[&:not([hidden])]:flex fixed left-1/2 top-1/2 z-50 max-h-[90vh] w-[90%] max-w-[420px] -translate-x-1/2 -translate-y-1/2 flex-col gap-5 overflow-y-auto rounded-xl bg-white p-6 font-sans text-[#0f2419] shadow-[0_0_0_100vmax_rgba(15,36,25,0.55)]">

 
                <div class="flex items-center justify-between border-b border-[#9aa89f]/40 pb-3">
                <h2 class="font-['Barlow_Condensed'] text-2xl font-bold uppercase tracking-wide" id="titre">Ajouter un joueur</h2>
                 <button type="button" id="fermer" aria-label="Fermer"
                      class="flex h-11 w-11 items-center justify-center rounded-lg text-xl text-[#4a5d52] hover:bg-[#f3f6f1] hover:text-[#0f2419] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1f7a4d]">✕</button>
                </div>

  
               <div class="flex flex-col gap-1.5">
                  <label for="nom" class="text-sm font-semibold">Nom complet</label>
                    <input type="text" id="nom" name="nom" placeholder="Ex. Youssef El Idrissi" required
                         class="h-11 w-full rounded-lg border border-[#9aa89f] bg-white px-3 text-[15px] placeholder:text-[#4a5d52]/60 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1f7a4d]">
                    <p id="erreur-nom" class="hidden text-xs font-medium text-[#9b1c14]">Entrez un nom valide.</p>
                </div>

  
              <fieldset class="flex flex-col gap-1.5">
              <legend class="mb-1.5 text-sm font-semibold">Poste</legend>
              <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer">
              <input type="radio" name="poste" value="GB" class="peer sr-only" required>
              <span class="flex h-11 items-center justify-between rounded-lg border border-[#9aa89f] bg-white px-3 text-sm hover:bg-[#f3f6f1] peer-checked:border-[#1f7a4d] peer-checked:bg-[#dcf2e3] peer-checked:font-semibold peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-[#1f7a4d]">
              Gardien <span class="h-2.5 w-2.5 rounded-full bg-[#b07800]"></span>
              </span>
              </label>
              <label class="cursor-pointer">
               <input type="radio" name="poste" value="DF" class="peer sr-only">
              <span class="flex h-11 items-center justify-between rounded-lg border border-[#9aa89f] bg-white px-3 text-sm hover:bg-[#f3f6f1] peer-checked:border-[#1f7a4d] peer-checked:bg-[#dcf2e3] peer-checked:font-semibold peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-[#1f7a4d]">
              Défenseur <span class="h-2.5 w-2.5 rounded-full bg-[#2f6fdc]"></span>
              </span>
             </label>
             <label class="cursor-pointer">
                     <input type="radio" name="poste" value="MIL" class="peer sr-only">
                     <span class="flex h-11 items-center justify-between rounded-lg border border-[#9aa89f] bg-white px-3 text-sm hover:bg-[#f3f6f1] peer-checked:border-[#1f7a4d] peer-checked:bg-[#dcf2e3] peer-checked:font-semibold peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-[#1f7a4d]">
                       Milieu <span class="h-2.5 w-2.5 rounded-full bg-[#1f7a4d]"></span>
                     </span>
             </label>
             <label class="cursor-pointer">
                  <input type="radio" name="poste" value="ATT" class="peer sr-only">
             <span class="flex h-11 items-center justify-between rounded-lg border border-[#9aa89f] bg-white px-3 text-sm hover:bg-[#f3f6f1] peer-checked:border-[#1f7a4d] peer-checked:bg-[#dcf2e3] peer-checked:font-semibold peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-[#1f7a4d]">
                 Attaquant <span class="h-2.5 w-2.5 rounded-full bg-[#d64a3f]"></span>
             </span>
             </label>
             </div>
             </fieldset>


             <div class="grid grid-cols-2 gap-3">
             <div class="flex flex-col gap-1.5">
             <label for="numero" class="text-sm font-semibold">Numéro (1 à 99)</label>
             <input type="number" id="numero" name="numero" min="1" max="99" required
             class="h-11 w-full rounded-lg border border-[#9aa89f] bg-white px-3 text-[15px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1f7a4d]">
             <p id="erreur-numero" class="hidden text-xs font-medium text-[#9b1c14]">Entre 1 et 99.</p>
             </div>
             <div class="flex flex-col gap-1.5">
             <label for="age" class="text-sm font-semibold">Âge</label>
             <input type="number" id="age" name="age" min="15" max="50" required
             class="h-11 w-full rounded-lg border border-[#9aa89f] bg-white px-3 text-[15px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1f7a4d]">
             <p id="erreur-age" class="hidden text-xs font-medium text-[#9b1c14]">Entre 15 et 50.</p>
             </div>
             </div>

  
            <fieldset class="flex flex-col gap-1.5">
            <legend class="mb-1.5 text-sm font-semibold">État</legend>
            <div class="flex gap-2">
            <label class="flex-1 cursor-pointer">
            <input type="radio" name="etat" value="En forme" class="peer sr-only" checked>
            <span class="flex h-11 items-center justify-center rounded-lg border border-[#9aa89f] bg-white text-sm hover:bg-[#f3f6f1] peer-checked:border-[#14633a] peer-checked:bg-[#dcf2e3] peer-checked:font-semibold peer-checked:text-[#14633a] peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-[#1f7a4d]">En forme</span>
            </label>
           <label class="flex-1 cursor-pointer">
           <input type="radio" name="etat" value="Blessé" class="peer sr-only">
           <span class="flex h-11 items-center justify-center rounded-lg border border-[#9aa89f] bg-white text-sm hover:bg-[#f3f6f1] peer-checked:border-[#9b1c14] peer-checked:bg-[#fde0dc] peer-checked:font-semibold peer-checked:text-[#9b1c14] peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-[#9b1c14]">Blessé</span>
           </label>
           </div>
           </fieldset>


           <div class="flex gap-3 pt-1">
           <button type="button" id="annuler"
            class="h-11 flex-1 rounded-lg border border-[#9aa89f] bg-white font-medium hover:bg-[#f3f6f1] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1f7a4d]">Annuler</button>
           <button type="submit" id="ajouter1"
            class="h-11 flex-1 rounded-lg bg-[#1f7a4d] font-bold text-white transition-colors hover:bg-[#186540] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1f7a4d]">Ajouter</button>
             </div>
            </form>
            </section>
              <nav id="pagination" class="mt-7 flex items-center justify-center gap-3 text-sm text-muted" aria-label="Pagination">
                    <button id="precedent" type="button" class="h-11 rounded-lg border border-line bg-white px-3.5 text-ink hover:bg-gray-50">Précédent</button>
                    <span id="numpage">Page 1 / 3</span>
                    <button id="suivant" type="button" class="h-11 rounded-lg bg-brand px-[18px] font-bold text-white hover:bg-[#186540]">Suivant</button>
               </nav>

        </main>
    </body>
</html>
