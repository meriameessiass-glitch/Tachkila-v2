<!DOCTYPE html>
<html>
    <head>
         <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tachkila</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="ui.js" type="module" defer></script>
        <script src="state.js" type="module" defer></script>
        <script src="script.js" type="module" defer></script>

    </head>
    <body class="">
        <header class="bg-black flex   justify-between flex-wrap items-center  px-8 h-auto py-2 gap-4 sm:px-8 shadow-md sticky top-0 z-50">
            <div class="shrink-0 h-auto object-contain">
                <img class="w-24 sm:w-32 flex-shrink-0" src="img/1793200483999509905_173976643_0.png" alt="logo">
            </div>
            <nav>
                <ul class="flex text-green-100 gap-4">
                    <li class="bg-green-800 border-none rounded-[4px] fles font-medium  items-center justify-center  p-2 lien-actif"><a href="index.html" class="lien-actif">Effectif</a></li>
                    <li><a href="composition.html" >Composition</a></li>
                    <li><a href="matchs.html" >Matchs</a></li>
                </ul>
            </nav>
            <div class="flex display:flex gap-2 place-items-center">
                <div class="text-yellow-500 font-bold text-[12px]">GD</div>
                <div class="border border-indigo-600 rounded-[10vw] w-2 h-2 bg-yellow-500"></div>
                <div class="text-blue-600 font-bold text-[12px]">DEF</div>
                <div class="border border-indigo-500 rounded-[10vw] w-2 h-2 bg-blue-600"></div>
                <div class="text-green-500 font-bold text-[12px]">MIL</div>
                <div class="border border-indigo-600 rounded-[10vw] w-2 h-2 bg-green-500"></div>
                <div class="text-red-500 text-100px font-bold text-[12px]">ATT</div>
                <div class="border border-indigo-600 rounded-[10vw] w-2 h-2 bg-red-500"></div>
            </div>

        </header>
        <main class="mx-auto max-w-[1280px] px-4 pb-12 pt-6 sm:px-16 sm:pt-10 bg-mist-100">
            <h1 class="font-display text-[40px] font-bold uppercase leading-none tracking-wide">Effectif</h1>
            <p class="mb-5 mt-1 text-sm text-muted">Atlas FC · 4 joueurs affichés sur 22</p>
            <div class="mb-6 flex flex-wrap gap-3">
                <input type="search" placeholder="Rechercher un joueur" class="h-11 min-w-full flex-1 rounded-lg border  bg-white px-3 text-[15px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand sm:min-w-0">
                <select aria-label="filtrer par poste" class="h-11 flex-1 rounded-lg border border-line bg-white px-3 text-[15px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand sm:min-w-0 " id="">
                    <option value="">Toute les postes</option>
                    <option value="GB">Gardien</option>
                    <option value="DF">Défenseur</option>
                    <option value="AT">Ataquant</option>
                    <option value="ML">Milieu</option>
                </select>
                <button type="button" class="h-11 rounded-lg bg-yellow-700 px-[18px] text-[15px] font-bold text-white hover:bg-[#186540]">Ajouter un joueur</button>
            </div>
            <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
               <article class="rounded-xl border-l-8 border-[#2f6fdc] bg-white py-5 pl-4 pr-4 shadow">
                <div class="flex min-h-9 items-center justify-between">
                    <span class="font-display text-4xl font-bold leading-none">4</span>
                </div>
                <h2 class="mb-1.5 mt-2 text-lg font-bold">Amine Berrada</h2>
                <p class="mb-2 text-sm text-muted">Défenseur · 24 ans</p>
                <span class="inline-block rounded-full bg-[#fde0dc] px-2.5 py-[3px] text-[12.5px] font-semibold text-[#9b1c14]">Blessé</span>
                <div class="mt-3 flex flex-wrap gap-2">
                        <button type="button" class="h-11 rounded-lg border border-line bg-white px-3.5 text-sm hover:bg-gray-50">Capitaine</button>
                        <button type="button" class="h-11 rounded-lg border border-line bg-white px-3.5 text-sm hover:bg-gray-50">Modifier</button>
                        <button type="button" class="h-11 rounded-lg border border-line bg-white px-3.5 text-sm text-[#9b1c14] hover:bg-red-50">Supprimer</button>
                </div>
               </article> 
            </section>
              <nav class="mt-7 flex items-center justify-center gap-3 text-sm text-muted" aria-label="Pagination">
                    <button type="button" class="h-11 rounded-lg border border-line bg-white px-3.5 text-ink hover:bg-gray-50">Précédent</button>
                    <span>Page 1 / 3</span>
                    <button type="button" class="h-11 rounded-lg bg-brand px-[18px] font-bold text-white hover:bg-[#186540]">Suivant</button>
               </nav>

        </main>
    </body>
</html>
